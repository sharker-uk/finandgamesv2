name: Process Devlog Drafts

on:
  push:
    paths:
      - 'src/content/devlog-drafts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process-drafts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Process Drafts with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-devlog.mjs

      - name: Commit Generated Devlogs and Clear Drafts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/devlogs/ src/content/devlog-drafts/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "content: auto-publish devlog from draft"
            git push origin main
          fi
